name: "Security - CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main]
  schedule:
    - cron: '0 22 * * 4'

permissions: {}

jobs:
  codeql:
    uses: cmu-sei/Crucible-Github-Actions/.github/workflows/codeql.yaml@codeql-v1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      languages: csharp
