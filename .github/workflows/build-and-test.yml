# Builds the API and runs Player.Vm.Api.Tests against PostgreSQL with the shared Crucible workflow, which
# takes the test runner from global.json; see the .NET Build and Test section of
# https://github.com/cmu-sei/Crucible-Github-Actions.
name: Build and Test

# Pull requests validate proposed changes. Pushes to main verify the result after merge.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  build-and-test:
    uses: cmu-sei/Crucible-Github-Actions/.github/workflows/dotnet-test.yaml@dotnet-test-v1
    permissions:
      contents: read
    with:
      test-project: src/Player.Vm.Api.Tests
