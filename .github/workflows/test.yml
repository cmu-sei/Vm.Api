name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # Unit tests plus the in-process API tests, which host Startup with the hypervisor and
  # player.api clients substituted. Neither needs a network, a database or a hypervisor.
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # Only the test project is restored/built: it pulls in Player.Vm.Api through its
      # ProjectReference, and the API image build is already covered by main.yml. The
      # Client project targets netstandard2.0 and is released separately (client.yml).
      - name: Restore
        run: dotnet restore src/Player.Vm.Api.Tests/Player.Vm.Api.Tests.csproj

      - name: Test
        run: >
          dotnet test src/Player.Vm.Api.Tests/Player.Vm.Api.Tests.csproj
          --no-restore
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      # Uploaded on failure too - the .trx is the only record of which assertion failed
      # once the runner is gone.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
