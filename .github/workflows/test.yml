name: Test

# Deliberately not scoped to a branch list. main.yml is limited to `main` because publishing is
# gated; running the test suite is not, and a regression should surface on the feature branch that
# introduced it rather than waiting for a pull request to be opened.
on:
  push:
  pull_request:

# Supersede a run that a later push to the same branch has already made stale. Which trigger fires for
# a given commit is settled by the job's `if` below, not here.
#
# Keyed on the branch name, because no single ref context identifies a branch across both triggers:
# github.ref is refs/heads/<branch> on push but refs/pull/<n>/merge on pull_request, and github.ref_name
# is <branch> then <n>/merge. Taking the pull request's head ref first and falling back to
# github.ref_name gives <branch> in both cases, so a fork's pull request and a same-repo branch are
# grouped the way a person would expect.
#
# The one thing this conflates is a fork's pull request with a local branch of the same name. Cancelling
# a stale run for that name is the wanted behaviour anyway, so it is not worth disambiguating.
concurrency:
  group: test-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Unit tests plus the in-process API tests, which host Startup with the hypervisor and player.api
  # clients substituted - so no hypervisor and no external Crucible service is involved.
  #
  # The database is real, though: DatabaseFixture starts PostgreSQL in Docker via Testcontainers and
  # migrates it, deliberately with no in-memory or SQLite fallback. This job therefore needs a working
  # Docker daemon and a reachable image registry, and most of the suite fails without them.
  tests:
    name: Tests
    runs-on: ubuntu-latest

    # One commit on a same-repo branch with an open pull request fires both triggers above, for the same
    # SHA. Deduplicating that by grouping the two runs together and cancelling the loser worked, but left
    # a cancelled run sitting on the commit - and a cancelled `dotnet test` truncates its output right
    # after "A total of 1 test files matched the specified pattern", which reads like the suite died
    # rather than like a duplicate being tidied away.
    #
    # So the two triggers divide the work instead of racing for it: the push run covers anything pushed
    # to this repo, and the pull_request run covers forks, which produce no push event here. Every branch
    # still gets tested on push, with or without a pull request, and no run is ever cancelled by its own
    # twin.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - uses: actions/checkout@v6

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          # The SDK version lives in global.json; never pin a second copy of it here.
          global-json-file: global.json

      # Keyed on the files that decide what gets restored: Directory.Packages.props holds every
      # version, and a project file changing is what adds or drops a reference.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The whole solution, not just the test project. Directory.Build.props sets
      # TreatWarningsAsErrors, and this is the only workflow that compiles Player.Vm.Api.Client on a
      # push: main.yml builds the image, and client.yml is workflow_dispatch, so a warning in the
      # Client project would otherwise first surface at release time.
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Testcontainers pulls this image itself, from inside the test host, on the first test that asks
      # for a database. Pulling it here instead changes where a registry failure surfaces, which is the
      # whole point: DatabaseFixture caches its start in a Lazy<Task>, so one Docker Hub blip faults
      # that single task and every database-backed test inherits it - 889 of 1451 tests, all reporting
      # the same "Could not start postgres:16-alpine" error, when this last happened. A transient
      # `connection reset by peer` from auth.docker.io ends up buried in some 19,000 lines of repeated
      # stack traces, and the run reads like a mass regression in the tests. Failing in this step says
      # what actually went wrong, and the retries mean it usually does not fail at all.
      #
      # Testcontainers' default pull policy is `Missing`, so finding the image already present is
      # exactly what makes it skip its own pull.
      #
      # The tag is read out of DatabaseFixture rather than written a second time here - two copies could
      # drift into pulling one server and testing against another, which would defeat the pre-pull
      # silently. A fixture this cannot be parsed out of fails the step instead.
      - name: Pull the PostgreSQL image
        run: |
          fixture=src/Player.Vm.Api.Tests/Infrastructure/DatabaseFixture.cs
          # `|| true` because the step's shell is `bash -e`: a no-match grep would otherwise abort here,
          # silently and with no message, instead of reaching the explanation below.
          image=$(grep -oP 'PostgresImage\s*=\s*"\K[^"]+' "$fixture" || true)

          if [ -z "$image" ]; then
            echo "::error file=$fixture::Could not read PostgresImage from $fixture, so there is no image to pull. Has the constant been renamed?"
            exit 1
          fi

          for attempt in 1 2 3; do
            if docker pull "$image"; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 10))
              echo "Pulling $image failed (attempt $attempt of 3); retrying in ${delay}s"
              sleep "$delay"
            fi
          done

          echo "::error::Could not pull $image after 3 attempts. This is the registry, not the tests - re-run the job."
          exit 1

      - name: Test
        id: test
        run: >
          dotnet test src/Player.Vm.Api.Tests/Player.Vm.Api.Tests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      # Uploaded on failure too - the .trx is the only record of which assertion failed once the
      # runner is gone. `error` rather than `warn` on the missing case: no .trx once the test step has
      # run means the test host died before writing one, which should not pass quietly.
      #
      # Conditioned on the test step's outcome rather than always(). always() also fires when the step
      # never ran - the job was cancelled, or restore or build failed - and there is legitimately no
      # .trx in those cases, so if-no-files-found: error turns the real failure into a confusing
      # "No files were found with the provided path" that reads like the tests are misconfigured.
      # `outcome` rather than `conclusion`, so a cancelled or skipped step is excluded either way.
      - name: Upload test results
        if: ${{ !cancelled() && contains(fromJSON('["success", "failure"]'), steps.test.outcome) }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: error
